apiVersion: 1

providers:
  - name: "Packaged Dashboards"
    orgId: 1
    folder: "Observability"
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
