connectors {
  mongodb {
    MongoDB {
      database = VaultPadlock
      description = ""
      enable = true
      parameters {
        mongo_type = single
        server = mongo
        w_mode = unsafe
      }
      password = password
      pool_size = 8
      resource_opts {
        health_check_interval = "15s"
        health_check_timeout = "60s"
        start_after_created = true
        start_timeout = "5s"
      }
      srv_record = false
      ssl {
        ciphers = []
        depth = 10
        enable = false
        hibernate_after = "5s"
        log_level = notice
        middlebox_comp_mode = true
        reuse_sessions = true
        secure_renegotiate = true
        verify = verify_none
        versions = [
          "tlsv1.3",
          "tlsv1.2"
        ]
      }
      topology {
        heartbeat_frequency_ms = "200s"
        max_overflow = 0
      }
      use_legacy_protocol = auto
      username = admin
    }
  }
}
log {
  console {}
  file {}
}