version: '3'
services:
  emqx:
    image: emqx/emqx:latest
    hostname: emqx_broker
    restart: always
    ports:
      - "1883:1883"   # MQTT TCP port
      - "8083:8083"   # MQTT WebSocket port
      - "8084:8084"   # MQTT secure WebSocket port
      - "8883:8883"   # MQTT SSL port
      - "18083:18083" # EMQX Dashboard port
    environment:
      # Set the dashboard admin password (default username is 'admin')
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "password"
      # Set the node name for clustering (optional, but recommended for persistence)
      EMQX_NODE__NAME: "emqx@emqx_broker" 
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

volumes:
  emqx_data:
  emqx_log:
